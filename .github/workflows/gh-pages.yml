name: Deploy Preview to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read # actions/deploy-pages 需要读取上传的构建产物
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Generate environment.debug.ts with mock enabled
        working-directory: frontend
        run: |
          cat > src/environments/environment.debug.ts << 'EOF'
          import { environmentBase } from './environment.base';

          export const environment = {
            ...environmentBase,
            useMock: {
              enable: true,
              exclude: '',
              delay: 500,
              log: false
            },
            api: {
              ...environmentBase.api,
              gateway: ''
            }
          };
          EOF

      - name: Build
        working-directory: frontend
        run: npm run build -- --configuration=debug --base-href /ai-relay/

      - name: Copy index.html as 404.html
        run: cp frontend/dist/airelay-web/browser/index.html frontend/dist/airelay-web/browser/404.html

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: frontend/dist/airelay-web/browser

      - id: deployment
        uses: actions/deploy-pages@v5
